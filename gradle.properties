## Gradle project-wide properties
# This file controls gradle build behaviour across all modules.

# Android build tools optimisation flags
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true

# Kotlin
kotlin.code.style=official

# AndroidX — force AndroidX support library
android.useAndroidX=true

# Compose compiler metrics (set to true during Phase 4 optimization)
# Writes recomposition reports to build/compose_metrics/
#kotlin.compose.enableCompilerMetrics=true
#kotlin.compose.enableCompilerReports=true

# Non-transitive R classes — prevents resource ID collisions in multi-module builds
android.nonTransitiveRClass=true
